name: Release Windows (DOTX v0.1.0)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag for draft release (e.g. v0.1.0)"
        required: false
        default: "v0.1.0-preview"
      create_tag:
        description: "Create git tag and push it (true/false)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package.json
            apps/desktop/package.json
            apps/website/package.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run website build sanity (ensures shared lockfile ok)
        run: npm run build --workspace=apps/website
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production

      - name: Typecheck desktop
        run: npm run typecheck --workspace=apps/desktop

      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --verbose

      - name: Build Tauri and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ inputs.version || github.ref_name }}
          releaseName: "DOTX ${{ inputs.version || github.ref_name }}"
          releaseBody: |
            ## DOTX ${{ inputs.version || github.ref_name }} — Preview

            This is the first preview installer for the DOTX Windows browser.

            **What's included:**
            - Tauri 2 + Rust + WebView2 shell with address bar, tabs, bookmarks, history, settings, download validation
            - Isolated navigation (http/https allow-list, blocks javascript:/data:/file:)
            - SHA-256 checksums attached below

            **Requirements:** Windows 10 1809+ or Windows 11, WebView2 Runtime (Evergreen)

            **Install:** Download `.msi` (recommended) or `.exe` and run. If SmartScreen warns (unsigned preview), click More info → Run anyway.

            **Known limitations:** WebView2 child-surface isolation is scaffolded; full per-tab WebViewWindow isolation requires Windows runtime verification. See docs/ARCHITECTURE.md and SECURITY.md.

            **Verify:** `Get-FileHash DOTX*.msi -Algorithm SHA256` and compare to checksums below.
          releaseDraft: true
          prerelease: true
          args: --verbose

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $bundle = "apps/desktop/src-tauri/target/release/bundle"
          Get-ChildItem $bundle -Recurse -Include *.msi,*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $line = "$h  $($_.Name)"
            Write-Host $line
            $line | Out-File -Append -FilePath checksums-SHA256.txt -Encoding utf8
          }
          if (Test-Path checksums-SHA256.txt) {
            Write-Host "=== Checksums ==="
            cat checksums-SHA256.txt
            # Append to release notes via gh CLI if available
            $checksumNote = "`n`n### SHA-256`n``````n" + (cat checksums-SHA256.txt | Out-String) + "``````"
            Write-Host $checksumNote
          } else {
            Write-Host "No artifacts found for checksums"
            exit 1
          }

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums-SHA256.txt
