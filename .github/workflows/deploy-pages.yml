# DOTX — GitHub Pages deployment
# Deploys apps/website (React + Vite) as a static site to GitHub Pages.
# - Uses official actions/deploy-pages + upload-pages-artifact
# - Resolves Vite base automatically from GITHUB_REPOSITORY (e.g. owner/dotx → /dotx/)
# - Includes SPA 404 fallback so BrowserRouter deep links refresh correctly
# - Runs only after build succeeds; concurrency prevents overlapping deploys

name: Deploy DOTX Website to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "apps/website/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package.json
            apps/website/package.json
            packages/shared/package.json

      - name: Detect package manager
        id: pm
        run: |
          if [ -f "pnpm-lock.yaml" ]; then echo "pm=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then echo "pm=yarn" >> $GITHUB_OUTPUT
          else echo "pm=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then npm i -g pnpm && pnpm install
          elif [ "${{ steps.pm.outputs.pm }}" = "yarn" ]; then yarn install --frozen-lockfile
          else npm install
          fi

      - name: Typecheck website
        run: npm run typecheck --workspace=apps/website

      - name: Build website (Vite)
        env:
          # GITHUB_REPOSITORY is automatically set by Actions (owner/repo)
          # Vite config derives base from it, so project sites get /dotx/ and user sites get /
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production
        run: npm run build --workspace=apps/website

      - name: Verify build output
        run: |
          echo "=== dist contents ==="
          ls -la apps/website/dist
          echo "=== checking index.html ==="
          test -f apps/website/dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          echo "=== checking assets ==="
          ls -la apps/website/dist/assets | head -n 50

      - name: Add SPA fallback (404.html) & .nojekyll
        run: |
          cp apps/website/dist/index.html apps/website/dist/404.html
          touch apps/website/dist/.nojekyll
          # Copy public sitemap/robots if not already in dist (Vite copies public/ automatically)
          echo "Created 404.html fallback and .nojekyll for GitHub Pages"
          ls -lh apps/website/dist/ | head -n 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
