# DOTX — GitHub Pages deployment
# Deploys apps/website (React + TypeScript + Vite) to https://dotsoftwarelkofficial.github.io/dotx/
# Uses official Pages actions, least-privilege permissions, and correct Vite base for project site.

name: Deploy DOTX Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-pages.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package.json
            apps/website/package.json
            packages/shared/package.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck website
        run: npm run typecheck --workspace=apps/website

      - name: Build website (Vite)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          NODE_ENV: production
        run: npm run build --workspace=apps/website

      - name: Verify build output and asset paths
        run: |
          echo "=== dist structure ==="
          ls -lh apps/website/dist
          test -f apps/website/dist/index.html || (echo "❌ dist/index.html missing" && exit 1)
          echo "=== index.html asset paths (must start with /dotx/) ==="
          grep -E 'src="/dotx/assets|href="/dotx/assets' apps/website/dist/index.html || (echo "⚠️  Base path check failed - assets may be broken on Pages"; grep -o 'src="[^"]*"' apps/website/dist/index.html | head -20)
          echo "=== sitemap/robots/manifest check ==="
          ls -lh apps/website/dist/sitemap.xml apps/website/dist/robots.txt apps/website/dist/manifest.webmanifest apps/website/dist/favicon.svg
          echo "=== Ensuring no README leaked as index ==="
          ! grep -q "Jekyll" apps/website/dist/index.html || (echo "❌ Jekyll content detected in dist index" && exit 1)

      - name: Add SPA fallback and static hosting guards
        run: |
          cp apps/website/dist/index.html apps/website/dist/404.html
          touch apps/website/dist/.nojekyll
          echo "Created 404.html fallback and .nojekyll"
          ls -lh apps/website/dist/*.html apps/website/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only deploy on push to main or manual dispatch, not on PRs
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
