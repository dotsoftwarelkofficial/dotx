<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOTX — Premium Windows Browser</title>
    <meta name="description" content="DOTX is a premium, fast, private Windows browser. Built with Tauri + Rust + WebView2. No telemetry by default." />
    <meta name="theme-color" content="#080A12" />
    <meta property="og:title" content="DOTX — Premium Windows Browser" />
    <meta property="og:description" content="Fast. Private. Designed for Windows 10/11." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./og-image.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // SPA redirect handler for GitHub Pages (keeps deep links working)
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
